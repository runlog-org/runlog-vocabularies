domain: pytest
description: pytest fixtures, markers, assertion helpers, CLI flags, and config keys
version: "pytest 8.x"
tokens:
  - "--capture"
  - "--co"
  - "--collect-only"
  - "--cov"
  - "--ff"
  - "--lf"
  - "--maxfail"
  - "--pdb"
  - "--tb"
  - "-k"
  - "-m"
  - "-q"
  - "-s"
  - "-v"
  - "-x"
  - addopts
  - approx
  - cache
  - capfd
  - capfdbinary
  - caplog
  - capsys
  - capsysbinary
  - conftest
  - deprecated_call
  - doctest_namespace
  - filterwarnings
  - fixture
  - monkeypatch
  - parametrize
  - pytest_plugins
  - pytestconfig
  - pytestmark
  - python_classes
  - python_files
  - python_functions
  - raises
  - recwarn
  - request
  - skip
  - skipif
  - testpaths
  - tmp_path
  - tmp_path_factory
  - usefixtures
  - warns
  - xfail

domain: postgresql
description: PostgreSQL-specific extensions beyond standard SQL
version: "PostgreSQL 16"
tokens:
  - ANALYZE
  - ARRAY
  - BIGSERIAL
  - CONCURRENTLY
  - CTE
  - EXCLUSIVE
  - EXPLAIN
  - HASH
  - INHERITS
  - JSONB
  - LATERAL
  - LIST
  - LOCK
  - MATERIALIZED
  - PARTITION
  - RANGE
  - REINDEX
  - ROW
  - SERIAL
  - SHARE
  - UUID
  - VACUUM
  - gen_random_uuid
  - information_schema
  - pg_catalog
  - pg_dump
  - pg_restore
  - pg_stat_activity
  - psql
  - tsquery
  - tsvector

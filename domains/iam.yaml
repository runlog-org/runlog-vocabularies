  - Allow
  - ArnEquals
  - ArnLike
  - Bool
  - Condition
  - DateEquals
  - DateGreaterThan
  - DateLessThan
  - Deny
  - Effect
  - Id
  - IpAddress
  - NotAction
  - NotIpAddress
  - NotPrincipal
  - NotResource
  - "Null"

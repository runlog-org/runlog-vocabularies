protocol: cache-control
description: HTTP caching directives and related header names
version: "RFC 9111"
tokens:
  - Age
  - Cache-Control
  - ETag
  - Expires
  - If-Modified-Since
  - If-None-Match
  - Last-Modified
  - Vary
  - immutable
  - max-age
  - max-stale
  - min-fresh
  - must-revalidate
  - must-understand
  - no-cache
  - no-store
  - no-transform
  - only-if-cached
  - private
  - proxy-revalidate
  - public
  - s-maxage
  - stale-if-error
  - stale-while-revalidate

  - block-all-mixed-content
  - child-src
  - connect-src
  - default-src
  - font-src
  - form-action
  - frame-ancestors
  - frame-src
  - img-src
  - manifest-src
  - media-src
  - none
  - object-src
  - report-sample
  - report-to
  - report-uri
  - require-trusted-types-for
  - sandbox
  - script-src
  - self
  - strict-dynamic
  - style-src
  - trusted-types
  - unsafe-eval
  - unsafe-hashes
  - unsafe-inline
  - upgrade-insecure-requests
  - wasm-unsafe-eval
  - worker-src

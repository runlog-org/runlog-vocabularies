name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# All checks share scripts/validate_vocabularies.py — the same code path
# devs run locally is the same code path the gate runs. Splitting into
# parallel matrix jobs (rather than one job with sequential steps) gives
# CI a separable failure surface: a broken `tokens:` shape doesn't mask a
# YAML parse error in the run log, and Required Status Checks can target
# each one independently. Re-parsing 76 small YAML files four times takes
# <1s per job, which is a fine price for that separation.
#
# The four matrix entries correspond to the four failure modes we care
# about:
#   1. parse     — a malformed *.yaml anywhere in the repo.
#   2. registry  — a vocab file whose declared tag is not in
#                  scope-registry.yaml. The consumer's load_vocabulary
#                  would attach tokens to a "domain" the scope-rule gate
#                  does not recognize as public — silent breakage.
#   3. shape     — a missing or non-list `tokens:` field. The consumer
#                  silently degrades to an empty allow-list, which would
#                  let undeclared tokens through unchallenged.
#   4. tokens    — duplicate tokens within a file (case-insensitive) and
#                  non-ASCII bytes (homoglyph defence). Cross-file
#                  collisions, credential markers, and unmatchable-token
#                  reports are emitted as WARNINGS only and do not affect
#                  the exit code.
#
# Reverse-direction directionality (registry tag without a vocab file)
# is intentionally NOT a CI failure here: the registry is much broader
# than the per-file vocab corpus by design (233 tags vs. 76 files
# today). That gap is exposed by the consumer as a soft signal via
# `runlog.sanitize.allowlist.report_vocab_coverage`, not a hard error.
#
# Action versions are pinned to full commit SHAs (not floating major
# tags) so a compromised tag on a third-party action repo can't ship
# malicious CI logic into this allow-list-data repo. Update by bumping
# the SHA and the trailing comment together. SHAs below resolve to:
#   actions/checkout@v6         -> de0fac2e4500dabe0009e67214ff5f5447ce83dd
#   actions/setup-python@v6     -> a309ff8b426b58ec0e2a45f0f869d46889d02405
#
# `${{ matrix.check }}` is interpolated into a `run:` step below. This
# is safe (not a command-injection vector) because the value is sourced
# from the literal matrix list — `parse | registry | shape | tokens` —
# not from any untrusted github.event.* field. The validator further
# restricts --check to a fixed argparse choices set.

jobs:
  validate:
    name: validate (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      # fail-fast: false so one broken check still surfaces the others in
      # the same CI run — a contributor fixing a parse error wants to see
      # the registry / shape / tokens results too, not chase failures one
      # by one across re-pushes.
      fail-fast: false
      matrix:
        check: [parse, registry, shape, tokens]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"
      - name: Install validator deps
        run: pip install --upgrade pyyaml
      - name: Run validator
        env:
          CHECK: ${{ matrix.check }}
        run: python3 scripts/validate_vocabularies.py --check "$CHECK"

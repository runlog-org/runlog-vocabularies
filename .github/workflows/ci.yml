name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# All three jobs share scripts/validate_vocabularies.py — same code path
# devs run locally, same code path the gate runs. Splitting into three
# jobs (rather than one job with three steps) gives CI a separable
# failure surface: a broken `tokens:` shape doesn't mask a YAML parse
# error in the run log, and Required Status Checks can target each one
# independently. Re-parsing 70 small YAML files three times takes <1s
# total, which is a fine price for that separation.
#
# The three jobs correspond to the three failure modes we care about:
#   1. validate-yaml          — a malformed *.yaml anywhere in the repo.
#   2. registry-consistency   — a vocab file whose declared tag is not
#                               in scope-registry.yaml. The consumer's
#                               load_vocabulary would attach tokens to a
#                               "domain" the scope-rule gate does not
#                               recognize as public — silent breakage.
#   3. vocabulary-shape-smoke — a missing or non-list `tokens:` field.
#                               The consumer silently degrades to an
#                               empty allow-list, which would let
#                               undeclared tokens through unchallenged.
#
# Reverse-direction directionality (registry tag without a vocab file)
# is intentionally NOT a CI failure here: the registry is much broader
# than the per-file vocab corpus by design (227 tags vs. 70 files
# today). That gap is exposed by the consumer as a soft signal via
# `runlog.sanitize.allowlist.report_vocab_coverage`, not a hard error.

jobs:
  validate-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validator deps
        run: pip install --upgrade pyyaml
      - name: Parse all *.yaml under repo root
        run: python3 scripts/validate_vocabularies.py --check parse

  registry-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validator deps
        run: pip install --upgrade pyyaml
      - name: Every vocab file's tag must be in scope-registry.yaml
        run: python3 scripts/validate_vocabularies.py --check registry

  vocabulary-shape-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validator deps
        run: pip install --upgrade pyyaml
      - name: Every vocab file must declare a tokens list
        run: python3 scripts/validate_vocabularies.py --check shape

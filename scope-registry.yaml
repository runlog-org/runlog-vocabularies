# Public-domain registry — every tag the runlog_submit scope rule accepts.
# One entry per tag. Adding a tag here is a data-only PR; no code change.
#
# Schema:
#   - tag (str, required, lowercase, kebab-case): the canonical tag name.
#   - description (str, required, one short sentence): what kind of system
#     this tag covers; used for human review of new submissions.
#   - category (str, required): one of: language | runtime | framework |
#     database | cloud | tooling | protocol | saas | concept | other.
#
# Sorted alphabetically by tag.

